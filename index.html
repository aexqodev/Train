<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поезд Артиклей: Собираем вагоны</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e6f2ff;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            overflow: hidden; 
            height: 100vh;
            user-select: none;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 20px;
            font-size: 2rem;
        }

        .drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 100px;
            border: 4px dashed #999;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        .word-card {
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            z-index: 60;
        }
        
        .word-card:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .railway-top {
            position: absolute;
            top: 12%;
            width: 100%;
            height: 180px;
            border-bottom: 8px solid #555;
            background-color: #d2d2d2;
            overflow: hidden;
        }

        .railway-bottom {
            position: absolute;
            bottom: 12%;
            width: 100%;
            height: 180px;
            border-top: 8px solid #555;
            background-color: #d2d2d2;
            overflow: hidden;
        }

        .train {
            display: flex;
            align-items: center;
            position: absolute;
            height: 100%;
        }

        .train-a { flex-direction: row-reverse; }
        .train-an { flex-direction: row; }

        /* Стили для паровозов */
        .locomotive {
            width: 150px;
            height: 110px;
            border-radius: 15px 15px 5px 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: 900;
            color: white;
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2);
            z-index: 10;
            flex-shrink: 0;
        }

        .loco-a { background-color: #4CAF50; border: 4px solid #2E7D32; }
        .loco-an { background-color: #2196F3; border: 4px solid #1565C0; }

        /* СТИЛИ ВАГОНОВ (ОБНОВЛЕНО) */
        .wagon {
            width: 145px;  /* Увеличено на 20% */
            height: 110px; /* Увеличено на 20% */
            background: transparent; /* Убран фон */
            border: none; /* Убрана рамка */
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            margin: 0 -2px; /* Легкая сцепка без сильного наложения */
        }

        /* Эффект наведения при перетаскивании на пустой вагон */
        .wagon.active-target.drag-over {
            transform: scale(1.1) translateY(-5px);
            filter: drop-shadow(0 0 15px #4CAF50);
            transition: all 0.2s;
        }

        /* Стили для картинки внутри вагона */
        .wagon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; /* Чтобы картинка не мешала ловить клик по вагону */
        }

        /* Текст, который появляется при правильном ответе */
        .wagon .wagon-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2E7D32;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.85); /* Полупрозрачный фон под текст для читаемости */
            padding: 5px 10px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Подсветка заполненного вагона */
        .wagon.filled {
            filter: drop-shadow(0 0 8px #4CAF50);
        }

        /* Пульсация для ПУСТОГО вагона (мигающая оранжевая обводка) */
        @keyframes pulse {
            0% { filter: drop-shadow(0 0 2px #ff9800); }
            50% { filter: drop-shadow(0 0 15px #ff9800); }
            100% { filter: drop-shadow(0 0 2px #ff9800); }
        }

        .wagon.active-target {
            animation: pulse 1.5s infinite;
            cursor: pointer;
        }

        .score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 30;
        }
    </style>
</head>
<body>

    <audio id="hornSound" src="https://raw.githubusercontent.com/aexqodev/Train/main/3-1.mp3" preload="auto"></audio>

    <div class="score-board">Счет: <span id="score">0</span></div>
    <h1>Перетащи слово в первый вагон поезда!</h1>

    <div class="railway-top">
        <div class="train train-a" id="trainA">
            <!-- ПАРОВОЗ А -->
            <div class="locomotive loco-a">A</div>
        </div>
    </div>

    <div class="railway-bottom">
        <div class="train train-an" id="trainAN">
            <!-- ПАРОВОЗ AN -->
            <div class="locomotive loco-an">AN</div>
        </div>
    </div>

    <div class="drop-zone" id="dropZone">
        <div class="word-card" id="wordCard" draggable="true">Cat</div>
    </div>

    <script>
        const words = [
            { word: "Ant", article: "an" }, { word: "Bed", article: "a" }, { word: "Cat", article: "a" },
            { word: "Dog", article: "a" }, { word: "Egg", article: "an" }, { word: "Flag", article: "a" },
            { word: "Glass", article: "a" }, { word: "Horse", article: "a" }, { word: "Ink", article: "an" },
            { word: "Jug", article: "a" }, { word: "Kangaroo", article: "a" }, { word: "Lamp", article: "a" },
            { word: "Mouse", article: "a" }, { word: "Nest", article: "a" }, { word: "Orange", article: "an" },
            { word: "Pin", article: "a" }, { word: "Queen", article: "a" }, { word: "Rabbit", article: "a" },
            { word: "Snake", article: "a" }, { word: "Tree", article: "a" }, { word: "Umbrella", article: "an" },
            { word: "Vest", article: "a" }, { word: "Window", article: "a" }, { word: "Box", article: "a" },
            { word: "Yacht", article: "a" }, { word: "Zip", article: "a" }
        ];

        let currentWord = null;
        let score = 0;

        const wordCard = document.getElementById('wordCard');
        const dropZone = document.getElementById('dropZone');
        const scoreElement = document.getElementById('score');
        const trainA = document.getElementById('trainA');
        const trainAN = document.getElementById('trainAN');
        const hornSound = document.getElementById('hornSound');
        let audioUnlocked = false;

        let posA = window.innerWidth * 0.2; 
        let posAN = window.innerWidth * 0.5; 
        let speedA = 0.75; 
        let speedAN = -0.75; 
        let isPausedA = false;
        let isPausedAN = false;

        function playHorn() {
            if (!hornSound) return;
            hornSound.currentTime = 0; 
            let playPromise = hornSound.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => console.warn("Звук не играет:", error));
            }
        }

        function unlockAudio() {
            if (!audioUnlocked && hornSound) {
                hornSound.volume = 0;
                hornSound.play().then(() => {
                    hornSound.pause();
                    hornSound.currentTime = 0;
                    hornSound.volume = 1;
                    audioUnlocked = true;
                }).catch(e => {});
            }
        }

        document.body.addEventListener('click', unlockAudio);
        document.body.addEventListener('touchstart', unlockAudio);
        document.body.addEventListener('dragstart', unlockAudio);

        function animateTrains() {
            if (!isPausedA) {
                posA += speedA;
                if (posA > window.innerWidth) {
                    posA = -trainA.offsetWidth - 50;
                    resetTrain(trainA, 'a');
                }
                trainA.style.left = posA + 'px';
            }

            if (!isPausedAN) {
                posAN += speedAN;
                if (posAN < -trainAN.offsetWidth) {
                    posAN = window.innerWidth + 50;
                    resetTrain(trainAN, 'an');
                }
                trainAN.style.left = posAN + 'px';
            }
            requestAnimationFrame(animateTrains);
        }

        animateTrains();

        // СОЗДАНИЕ ВАГОНА
        function createWagon(trainElement, articleType) {
            const wagon = document.createElement('div');
            wagon.className = 'wagon active-target';
            wagon.dataset.article = articleType;
            
            // Убедитесь, что название файла правильное (регистр букв важен!)
            wagon.innerHTML = '<img src="Вагон2-Photoroom.png" alt="Вагон">';
            
            trainElement.appendChild(wagon);
            return wagon;
        }

        function hasActiveWagon(trainElement) {
            return trainElement.querySelector('.active-target') !== null;
        }

        function initTrains() {
            const wagonA = createWagon(trainA, 'a');
            setupDropEvents(wagonA);
            const wagonAN = createWagon(trainAN, 'an');
            setupDropEvents(wagonAN);
        }

        function resetTrain(trainElement, articleType) {
            const oldWagons = trainElement.querySelectorAll('.wagon');
            oldWagons.forEach(w => w.remove());
            const newWagon = createWagon(trainElement, articleType);
            setupDropEvents(newWagon);
        }

        function setupDropEvents(wagon) {
            wagon.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (wagon.classList.contains('active-target')) {
                    wagon.classList.add('drag-over');
                }
            });

            wagon.addEventListener('dragleave', () => {
                wagon.classList.remove('drag-over');
            });

            wagon.addEventListener('drop', (e) => {
                e.preventDefault();
                wagon.classList.remove('drag-over');

                const targetArticle = wagon.dataset.article;
                const wordArticle = currentWord.article;

                if (targetArticle === wordArticle) {
                    score += 10;
                    scoreElement.textContent = score;
                    
                    // Вагон становится заполненным
                    wagon.classList.remove('active-target');
                    wagon.classList.add('filled');
                    
                    // Добавляем слово ПОВЕРХ картинки вагона
                    const textOverlay = document.createElement('div');
                    textOverlay.className = 'wagon-text';
                    textOverlay.textContent = currentWord.word;
                    wagon.appendChild(textOverlay);
                    
                    // Отключаем перетаскивание в этот вагон
                    wagon.style.pointerEvents = 'none';

                    const trainElement = wagon.closest('.train');
                    // Добавляем новый вагон, если пустых не осталось
                    if (!hasActiveWagon(trainElement)) {
                        const newWagon = createWagon(trainElement, targetArticle);
                        setupDropEvents(newWagon);
                    }

                    wordCard.style.display = 'none';
                    setTimeout(loadNewWord, 300);

                } else {
                    playHorn(); 
                    if (targetArticle === 'a') {
                        isPausedA = true;
                    } else {
                        isPausedAN = true;
                    }
                    
                    wordCard.style.transform = "translateX(10px)";
                    setTimeout(() => { wordCard.style.transform = "translateX(-10px)"; }, 50);
                    setTimeout(() => { wordCard.style.transform = "translateX(0)"; }, 100);

                    setTimeout(() => {
                        dropZone.appendChild(wordCard);
                    }, 500);
                }
            });
        }

        function loadNewWord() {
            const randomIndex = Math.floor(Math.random() * words.length);
            currentWord = words[randomIndex];
            wordCard.textContent = currentWord.word;
            wordCard.style.display = 'block';
            dropZone.appendChild(wordCard);
            isPausedA = false;
            isPausedAN = false;
        }

        initTrains();
        loadNewWord();

        wordCard.addEventListener('dragstart', (e) => {
            unlockAudio();
            e.dataTransfer.setData('text/plain', currentWord.article);
            e.dataTransfer.effectAllowed = 'move';
        });

        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!e.target.classList.contains('wagon') && !e.target.closest('.wagon')) {
                dropZone.appendChild(wordCard);
            }
        });
    </script>
</body>
</html>
