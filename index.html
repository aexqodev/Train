<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поезд Артиклей: Собираем вагоны</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e6f2ff;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            overflow: hidden; 
            height: 100vh;
            user-select: none;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 20px;
            font-size: 2rem;
        }

        .drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 100px;
            border: 4px dashed #999;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        .word-card {
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            z-index: 60;
        }
        
        .word-card:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .railway-top {
            position: absolute;
            top: 12%;
            width: 100%;
            height: 180px;
            border-bottom: 8px solid #555;
            background-color: #d2d2d2;
            overflow: hidden;
        }

        .railway-bottom {
            position: absolute;
            bottom: 12%;
            width: 100%;
            height: 180px;
            border-top: 8px solid #555;
            background-color: #d2d2d2;
            overflow: hidden;
        }

        .train {
            display: flex;
            align-items: center;
            position: absolute;
            height: 100%;
        }

        .train-a { flex-direction: row-reverse; }
        .train-an { flex-direction: row; }

        .locomotive {
            width: 150px;
            height: 110px;
            border-radius: 15px 15px 5px 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: 900;
            color: white;
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2);
            z-index: 10;
            flex-shrink: 0;
        }

        .loco-a { background-color: #4CAF50; border: 4px solid #2E7D32; }
        .loco-an { background-color: #2196F3; border: 4px solid #1565C0; }

        .wagon {
            width: 120px;
            height: 90px;
            background-color: #f0f0f0;
            border: 4px solid #999;
            border-radius: 8px;
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #aaa;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .train-a .wagon { margin-right: -4px; }
        .train-an .wagon { margin-left: -4px; }

        .wagon.active-target {
            border-color: #ff9800;
            background-color: #fff3e0;
            box-shadow: 0 0 15px rgba(255, 152, 0, 0.5);
            animation: pulse 1.5s infinite;
        }

        .wagon.drag-over {
            transform: scale(1.1);
            background-color: #e8f5e9;
            border-color: #4CAF50;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(255, 152, 0, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 152, 0, 0.8); }
            100% { box-shadow: 0 0 10px rgba(255, 152, 0, 0.5); }
        }

        .score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 30;
        }
    </style>
</head>
<body>

    <!-- ========================================================= -->
    <!-- 👇👇👇 СЮДА ВСТАВЬТЕ СВОЙ ЗВУК 👇👇👇 -->
    <!-- ========================================================= -->
    <!-- 
        1. Скачайте звук гудка (например, horn.mp3) и положите его в ту же папку, что и этот HTML-файл.
        2. В атрибуте src напишите название файла: src="horn.mp3"
        
        Если вы загружаете звук на GitHub, ссылка будет выглядеть так:
        <audio id="hornSound" src="https://raw.githubusercontent.com/ВАШ_НИК/ВАШ_РЕПОЗИТОРИЙ/main/horn.mp3"></audio>
    -->
    <audio id="hornSound" src="https://raw.githubusercontent.com/aexqodev/Train/main/3-1.mp3"></audio>
    <!-- ========================================================= -->


    <div class="score-board">Счет: <span id="score">0</span></div>
    <h1>Перетащи слово в первый вагон поезда!</h1>

    <div class="railway-top">
        <div class="train train-a" id="trainA">
            <div class="locomotive loco-a">A</div>
        </div>
    </div>

    <div class="railway-bottom">
        <div class="train train-an" id="trainAN">
            <div class="locomotive loco-an">AN</div>
        </div>
    </div>

    <div class="drop-zone" id="dropZone">
        <div class="word-card" id="wordCard" draggable="true">Cat</div>
    </div>

    <script>
        const words = [
            { word: "Ant", article: "an" },
            { word: "Bed", article: "a" },
            { word: "Cat", article: "a" },
            { word: "Dog", article: "a" },
            { word: "Egg", article: "an" },
            { word: "Flag", article: "a" },
            { word: "Glass", article: "a" },
            { word: "Horse", article: "a" },
            { word: "Ink", article: "an" },
            { word: "Jug", article: "a" },
            { word: "Kangaroo", article: "a" },
            { word: "Lamp", article: "a" },
            { word: "Mouse", article: "a" },
            { word: "Nest", article: "a" },
            { word: "Orange", article: "an" },
            { word: "Pin", article: "a" },
            { word: "Queen", article: "a" },
            { word: "Rabbit", article: "a" },
            { word: "Snake", article: "a" },
            { word: "Tree", article: "a" },
            { word: "Umbrella", article: "an" },
            { word: "Vest", article: "a" },
            { word: "Window", article: "a" },
            { word: "Box", article: "a" },
            { word: "Yacht", article: "a" },
            { word: "Zip", article: "a" }
        ];

        let currentWord = null;
        let score = 0;

        const wordCard = document.getElementById('wordCard');
        const dropZone = document.getElementById('dropZone');
        const scoreElement = document.getElementById('score');
        
        const trainA = document.getElementById('trainA');
        const trainAN = document.getElementById('trainAN');

        // Находим наш аудио-элемент
        const hornSound = document.getElementById('hornSound');

        let posA = window.innerWidth * 0.2; 
        let posAN = window.innerWidth * 0.5; 
        
        let speedA = 0.75; 
        let speedAN = -0.75; 
        
        let isPausedA = false;
        let isPausedAN = false;

        // --- ФУНКЦИЯ ЗВУКА ---
        function playHorn() {
            if (hornSound) {
                // Сбрасываем звук в начало (если он еще играет)
                hornSound.currentTime = 0; 
                // Воспроизводим
                hornSound.play().catch(error => {
                    console.log("Браузер заблокировал звук или файл не найден:", error);
                });
            }
        }

        // --- АНИМАЦИЯ ПОЕЗДОВ ---
        function animateTrains() {
            if (!isPausedA) {
                posA += speedA;
                if (posA > window.innerWidth) {
                    posA = -trainA.offsetWidth - 50;
                    resetTrain(trainA, 'a');
                }
                trainA.style.left = posA + 'px';
            }

            if (!isPausedAN) {
                posAN += speedAN;
                if (posAN < -trainAN.offsetWidth) {
                    posAN = window.innerWidth + 50;
                    resetTrain(trainAN, 'an');
                }
                trainAN.style.left = posAN + 'px';
            }

            requestAnimationFrame(animateTrains);
        }

        animateTrains();

        // --- ЛОГИКА ИГРЫ ---

        function createWagon(trainElement, articleType) {
            const wagon = document.createElement('div');
            wagon.className = 'wagon active-target';
            wagon.dataset.article = articleType;
            wagon.textContent = "Кинь сюда";
            
            trainElement.appendChild(wagon);
            return wagon;
        }

        function hasActiveWagon(trainElement) {
            return trainElement.querySelector('.active-target') !== null;
        }

        function initTrains() {
            const wagonA = createWagon(trainA, 'a');
            setupDropEvents(wagonA);
            
            const wagonAN = createWagon(trainAN, 'an');
            setupDropEvents(wagonAN);
        }

        function resetTrain(trainElement, articleType) {
            const oldWagons = trainElement.querySelectorAll('.wagon');
            oldWagons.forEach(w => w.remove());

            const newWagon = createWagon(trainElement, articleType);
            setupDropEvents(newWagon);
        }

        function setupDropEvents(wagon) {
            wagon.addEventListener('dragover', (e) => {
                e.preventDefault();
                wagon.classList.add('drag-over');
            });

            wagon.addEventListener('dragleave', () => {
                wagon.classList.remove('drag-over');
            });

            wagon.addEventListener('drop', (e) => {
                e.preventDefault();
                wagon.classList.remove('drag-over');

                const targetArticle = wagon.dataset.article;
                const wordArticle = currentWord.article;

                if (targetArticle === wordArticle) {
                    // ПРАВИЛЬНЫЙ ОТВЕТ
                    score += 10;
                    scoreElement.textContent = score;
                    
                    wagon.classList.remove('active-target');
                    wagon.style.backgroundColor = '#c8e6c9';
                    wagon.style.borderColor = '#4CAF50';
                    wagon.textContent = currentWord.word;
                    wagon.style.color = '#2E7D32';
                    wagon.style.fontWeight = 'bold';
                    wagon.style.pointerEvents = 'none';

                    const trainElement = wagon.closest('.train');
                    if (!hasActiveWagon(trainElement)) {
                        const newWagon = createWagon(trainElement, targetArticle);
                        setupDropEvents(newWagon);
                    }

                    wordCard.style.display = 'none';
                    setTimeout(loadNewWord, 300);

                } else {
                    // ОШИБКА 
                    playHorn(); // Воспроизводим гудок

                    if (targetArticle === 'a') {
                        isPausedA = true;
                    } else {
                        isPausedAN = true;
                    }
                    
                    wordCard.style.transform = "translateX(10px)";
                    setTimeout(() => { wordCard.style.transform = "translateX(-10px)"; }, 50);
                    setTimeout(() => { wordCard.style.transform = "translateX(0)"; }, 100);

                    setTimeout(() => {
                        dropZone.appendChild(wordCard);
                    }, 500);
                }
            });
        }

        function loadNewWord() {
            const randomIndex = Math.floor(Math.random() * words.length);
            currentWord = words[randomIndex];
            wordCard.textContent = currentWord.word;
            wordCard.style.display = 'block';
            dropZone.appendChild(wordCard);
            
            isPausedA = false;
            isPausedAN = false;
        }

        initTrains();
        loadNewWord();

        wordCard.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', currentWord.article);
            e.dataTransfer.effectAllowed = 'move';
        });

        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!e.target.classList.contains('wagon')) {
                dropZone.appendChild(wordCard);
            }
        });
    </script>
</body>
</html>
