<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поезд Артиклей: Собираем вагоны</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e6f2ff;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            overflow: hidden; 
            height: 100vh;
            user-select: none;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 20px;
            font-size: 2rem;
        }

        .drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 100px;
            border: 4px dashed #999;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }

        .word-card {
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            cursor: grab;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            z-index: 60;
        }
        
        .word-card:active {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .railway-top {
            position: absolute;
            top: 12%;
            width: 100%;
            height: 180px;
            border-bottom: 8px solid #555;
            background-color: #d2d2d2;
            overflow: hidden;
        }

        .railway-bottom {
            position: absolute;
            bottom: 12%;
            width: 100%;
            height: 180px;
            border-top: 8px solid #555;
            background-color: #d2d2d2;
            overflow: hidden;
        }

        .train {
            display: flex;
            align-items: center;
            position: absolute;
            height: 100%;
        }

        .train-a { flex-direction: row-reverse; }
        .train-an { flex-direction: row; }

        .locomotive {
            width: 150px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: 900;
            color: white;
            z-index: 10;
            flex-shrink: 0;
            background: transparent;
            border: none;
        }

        /* Оставляем буквы на случай, если картинки еще нет */
        .loco-a { background-color: #4CAF50; border: 4px solid #2E7D32; border-radius: 15px 15px 5px 5px;}
        .loco-an { background-color: #2196F3; border: 4px solid #1565C0; border-radius: 15px 15px 5px 5px;}

        /* Если вставили картинку, стили фона убираются автоматически */
        img.locomotive {
            background: transparent !important;
            border: none !important;
            object-fit: contain;
        }

        .wagon {
            width: 145px; 
            height: 110px; 
            background: transparent; 
            border: none; 
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            margin: 0 -2px; 
        }

        .wagon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none; 
        }

        .wagon .wagon-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2E7D32;
            font-weight: bold;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.85); 
            padding: 5px 10px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Подсветка заполненных вагонов */
        .train-a .wagon.filled { filter: drop-shadow(0 0 8px #4CAF50); }
        .train-an .wagon.filled { filter: drop-shadow(0 0 8px #2196F3); }

        .train-a .wagon.filled .wagon-text { color: #2E7D32; }
        .train-an .wagon.filled .wagon-text { color: #1565C0; }

        /* Пульсация для пустых вагонов */
        @keyframes pulse-a {
            0% { filter: drop-shadow(0 0 2px #4CAF50); }
            50% { filter: drop-shadow(0 0 15px #4CAF50); }
            100% { filter: drop-shadow(0 0 2px #4CAF50); }
        }

        @keyframes pulse-an {
            0% { filter: drop-shadow(0 0 2px #2196F3); }
            50% { filter: drop-shadow(0 0 15px #2196F3); }
            100% { filter: drop-shadow(0 0 2px #2196F3); }
        }

        .train-a .wagon.active-target {
            animation: pulse-a 1.5s infinite;
            cursor: pointer;
        }

        .train-an .wagon.active-target {
            animation: pulse-an 1.5s infinite;
            cursor: pointer;
        }

        .wagon.active-target.drag-over {
            transform: scale(1.1) translateY(-5px);
            transition: all 0.2s;
        }

        .score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            background: white;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 30;
        }
    </style>
</head>
<body>

    <audio id="hornSound" src="https://raw.githubusercontent.com/aexqodev/Train/main/3-1.mp3" preload="auto"></audio>

    <div class="score-board">Счет: <span id="score">0</span></div>
    <h1>Перетащи слово в первый вагон поезда!</h1>

    <div class="railway-top">
        <div class="train train-a" id="trainA">
            
            <!-- ============================================================== -->
            <!-- 👇👇👇 ЗАМЕНИТЕ ЭТО НА КАРТИНКУ ПАРОВОЗА "A" 👇👇👇 -->
            <!-- ============================================================== -->
            <!-- Для этого удалите строку <div class="locomotive loco-a">A</div> ниже и вставьте: -->
            <!-- <img src="ССЫЛКА_НА_ПАРОВОЗ_A.png" class="locomotive" alt="A"> -->
            
            <div class="locomotive loco-a">A</div>
            
        </div>
    </div>

    <div class="railway-bottom">
        <div class="train train-an" id="trainAN">
            
            <!-- ============================================================== -->
            <!-- 👇👇👇 ЗАМЕНИТЕ ЭТО НА КАРТИНКУ ПАРОВОЗА "AN" 👇👇👇 -->
            <!-- ============================================================== -->
            <!-- Для этого удалите строку <div class="locomotive loco-an">AN</div> ниже и вставьте: -->
            <!-- <img src="ССЫЛКА_НА_ПАРОВОЗ_AN.png" class="locomotive" alt="AN"> -->
            
            <div class="locomotive loco-an">AN</div>
            
        </div>
    </div>

    <div class="drop-zone" id="dropZone">
        <div class="word-card" id="wordCard" draggable="true">cat</div>
    </div>

    <script>
        // Все слова с МАЛЕНЬКОЙ БУКВЫ
        const words = [
            { word: "ant", article: "an" }, { word: "bed", article: "a" }, { word: "cat", article: "a" },
            { word: "dog", article: "a" }, { word: "egg", article: "an" }, { word: "flag", article: "a" },
            { word: "glass", article: "a" }, { word: "horse", article: "a" }, { word: "ink", article: "an" },
            { word: "jug", article: "a" }, { word: "kangaroo", article: "a" }, { word: "lamp", article: "a" },
            { word: "mouse", article: "a" }, { word: "nest", article: "a" }, { word: "orange", article: "an" },
            { word: "pin", article: "a" }, { word: "queen", article: "a" }, { word: "rabbit", article: "a" },
            { word: "snake", article: "a" }, { word: "tree", article: "a" }, { word: "umbrella", article: "an" },
            { word: "vest", article: "a" }, { word: "window", article: "a" }, { word: "box", article: "a" },
            { word: "yacht", article: "a" }, { word: "zip", article: "a" }
        ];

        let currentWord = null;
        let score = 0;

        const wordCard = document.getElementById('wordCard');
        const dropZone = document.getElementById('dropZone');
        const scoreElement = document.getElementById('score');
        const trainA = document.getElementById('trainA');
        const trainAN = document.getElementById('trainAN');
        const hornSound = document.getElementById('hornSound');
        let audioUnlocked = false;

        let posA = window.innerWidth * 0.2; 
        let posAN = window.innerWidth * 0.5; 
        let speedA = 0.75; 
        let speedAN = -0.75; 
        let isPausedA = false;
        let isPausedAN = false;

        function playHorn() {
            if (!hornSound) return;
            hornSound.currentTime = 0; 
            let playPromise = hornSound.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => console.warn("Звук не играет:", error));
            }
        }

        function unlockAudio() {
            if (!audioUnlocked && hornSound) {
                hornSound.volume = 0;
                hornSound.play().then(() => {
                    hornSound.pause();
                    hornSound.currentTime = 0;
                    hornSound.volume = 1;
                    audioUnlocked = true;
                }).catch(e => {});
            }
        }

        document.body.addEventListener('click', unlockAudio);
        document.body.addEventListener('touchstart', unlockAudio);
        document.body.addEventListener('dragstart', unlockAudio);

        function animateTrains() {
            if (!isPausedA) {
                posA += speedA;
                if (posA > window.innerWidth) {
                    posA = -trainA.offsetWidth - 50;
                    resetTrain(trainA, 'a');
                }
                trainA.style.left = posA + 'px';
            }

            if (!isPausedAN) {
                posAN += speedAN;
                if (posAN < -trainAN.offsetWidth) {
                    posAN = window.innerWidth + 50;
                    resetTrain(trainAN, 'an');
                }
                trainAN.style.left = posAN + 'px';
            }
            requestAnimationFrame(animateTrains);
        }

        animateTrains();

        // =====================================================================
        // 👇👇👇 СЮДА ВСТАВЬТЕ ССЫЛКИ НА ВАШИ 5 КАРТИНОК ВАГОНОВ 👇👇👇
        // =====================================================================
        // Этот массив используется для ОБОИХ поездов.
        // Цвета будут выбираться случайным образом из этого списка.
        
        const WAGON_IMAGES = [
            "Вагон1-Photoroom.png", // Картинка 1
            "Вагон2-Photoroom.png", // Картинка 2
            "Вагон3-Photoroom.png", // Картинка 3
            "Вагон4-Photoroom.png", // Картинка 4
            "Вагон5-Photoroom.png"  // Картинка 5
        ];
        // =====================================================================

        function createWagon(trainElement, articleType) {
            const wagon = document.createElement('div');
            wagon.className = 'wagon active-target';
            wagon.dataset.article = articleType;
            
            // Выбираем СЛУЧАЙНУЮ картинку из массива
            const randomIndex = Math.floor(Math.random() * WAGON_IMAGES.length);
            const imgSrc = WAGON_IMAGES[randomIndex];
            
            wagon.innerHTML = `<img src="${imgSrc}" alt="Вагон">`;
            
            trainElement.appendChild(wagon);
            return wagon;
        }

        function hasActiveWagon(trainElement) {
            return trainElement.querySelector('.active-target') !== null;
        }

        function initTrains() {
            const wagonA = createWagon(trainA, 'a');
            setupDropEvents(wagonA);
            const wagonAN = createWagon(trainAN, 'an');
            setupDropEvents(wagonAN);
        }

        function resetTrain(trainElement, articleType) {
            const oldWagons = trainElement.querySelectorAll('.wagon');
            oldWagons.forEach(w => w.remove());
            
            // Создаем один новый вагон (цвет будет случайным)
            const newWagon = createWagon(trainElement, articleType);
            setupDropEvents(newWagon);
        }

        function setupDropEvents(wagon) {
            wagon.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (wagon.classList.contains('active-target')) {
                    wagon.classList.add('drag-over');
                }
            });

            wagon.addEventListener('dragleave', () => {
                wagon.classList.remove('drag-over');
            });

            wagon.addEventListener('drop', (e) => {
                e.preventDefault();
                wagon.classList.remove('drag-over');

                const targetArticle = wagon.dataset.article;
                const wordArticle = currentWord.article;

                if (targetArticle === wordArticle) {
                    score += 10;
                    scoreElement.textContent = score;
                    
                    wagon.classList.remove('active-target');
                    wagon.classList.add('filled');
                    
                    const textOverlay = document.createElement('div');
                    textOverlay.className = 'wagon-text';
                    textOverlay.textContent = currentWord.word; 
                    wagon.appendChild(textOverlay);
                    
                    wagon.style.pointerEvents = 'none';

                    const trainElement = wagon.closest('.train');
                    if (!hasActiveWagon(trainElement)) {
                        const newWagon = createWagon(trainElement, targetArticle);
                        setupDropEvents(newWagon);
                    }

                    wordCard.style.display = 'none';
                    setTimeout(loadNewWord, 300);

                } else {
                    playHorn(); 
                    if (targetArticle === 'a') {
                        isPausedA = true;
                    } else {
                        isPausedAN = true;
                    }
                    
                    wordCard.style.transform = "translateX(10px)";
                    setTimeout(() => { wordCard.style.transform = "translateX(-10px)"; }, 50);
                    setTimeout(() => { wordCard.style.transform = "translateX(0)"; }, 100);

                    setTimeout(() => {
                        dropZone.appendChild(wordCard);
                    }, 500);
                }
            });
        }

        function loadNewWord() {
            const randomIndex = Math.floor(Math.random() * words.length);
            currentWord = words[randomIndex];
            wordCard.textContent = currentWord.word;
            wordCard.style.display = 'block';
            dropZone.appendChild(wordCard);
            isPausedA = false;
            isPausedAN = false;
        }

        initTrains();
        loadNewWord();

        wordCard.addEventListener('dragstart', (e) => {
            unlockAudio();
            e.dataTransfer.setData('text/plain', currentWord.article);
            e.dataTransfer.effectAllowed = 'move';
        });

        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!e.target.classList.contains('wagon') && !e.target.closest('.wagon')) {
                dropZone.appendChild(wordCard);
            }
        });
    </script>
</body>
</html>
