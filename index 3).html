<!DOCTYPE html><html lang="ru"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Интерактивный поезд: Артикли a и an</title>    <style>        body {            margin: 0;            padding: 0;            background-color: #e6f2ff; /* Светло-голубой фон (небо) */            font-family: 'Comic Sans MS', 'Arial', sans-serif;            overflow: hidden; /* Убираем прокрутку, чтобы поезд ездил ровно */            display: flex;            flex-direction: column;            align-items: center;            height: 100vh;        }        h1 {            color: #333;            margin-top: 20px;            text-align: center;            font-size: 2.5rem;        }        /* Табло с заданием */        .task-board {            position: absolute;            top: 100px;            padding: 20px 40px;            background-color: white;            border-radius: 15px;            box-shadow: 0 10px 20px rgba(0,0,0,0.1);            text-align: center;            font-size: 2.5rem; /* Увеличили шрифт на табло */            font-weight: bold;            color: #333;            min-height: 100px;            min-width: 500px;            display: flex;            align-items: center;            justify-content: center;            border: 5px dashed #ff9800;            z-index: 10;        }        .task-board span {            color: #d32f2f;            margin-right: 15px;        }        /* Кнопка для запуска поезда */        .play-btn {            position: absolute;            top: 250px;            padding: 15px 30px;            font-size: 1.5rem;            background-color: #4CAF50;            color: white;            border: none;            border-radius: 10px;            cursor: pointer;            display: none;            z-index: 10;            box-shadow: 0 6px 8px rgba(0,0,0,0.2);            transition: transform 0.1s;        }        .play-btn:hover {            background-color: #45a049;            transform: scale(1.05);        }        /* Контейнер для железной дороги */        .railway {            width: 100%;            height: 400px; /* Увеличили высоту дороги */            position: absolute;            bottom: 50px;            overflow: hidden;            border-bottom: 10px solid #555; /* Рельсы */            border-top: 12px dashed #888;   /* Шпалы */            background-color: #d2d2d2;        }        /* Сам поезд */        .train {            display: flex;            align-items: flex-end;            position: absolute;            bottom: 10px; /* Чуть выше рельсов */            left: 100%;            animation: moveTrain 25s linear infinite; /* Увеличили время проезда (медленнее), т.к. вагоны больше */            cursor: pointer;        }        /* Пауза при клике */        .train.paused {            animation-play-state: paused;        }        /* Картинки вагонов */        .train img {            height: 300px; /* ВАГОНЫ СТАЛИ БОЛЬШЕ (было 150px) */            margin-right: -10px; /* Отрицательный отступ, чтобы вагоны красиво сцепились */            object-fit: contain;            transition: transform 0.2s, filter 0.2s;        }        /* Эффект при наведении на вагон */        .train img:hover {            transform: translateY(-15px) scale(1.05);             filter: drop-shadow(0px 15px 10px rgba(0,0,0,0.3));        }        /* Анимация движения */        @keyframes moveTrain {            0% { left: 100%; }            100% { left: -200%; } /* Уезжает влево, учитывая бОльшую ширину картинок */        }    </style></head><body>    <h1>Нажми на вагон, чтобы прочитать правило!</h1>    <!-- Табло с заданием -->    <div class="task-board" id="taskBoard">        Нажми на проезжающий вагон...    </div>    <!-- Кнопка продолжить -->    <button class="play-btn" id="playBtn">Поехали дальше! ▶</button>    <!-- Железная дорога -->    <div class="railway">        <div class="train" id="train">            <!-- Вагоны добавляются через JavaScript -->        </div>    </div>    <script>        // ВАШИ ССЫЛКИ НА КАРТИНКИ        const rawBaseUrl = "https://raw.githubusercontent.com/aexqodev/ВАШЕ_НАЗВАНИЕ_РЕПОЗИТОРИЯ/main/";                const trainCars = [            {                 id: 'vagon1',                 img: rawBaseUrl + 'Baron2-Photoroom.png',                 text: 'an egg, an orange, an ant'             },            {                 id: 'vagon2',                 img: rawBaseUrl + 'Baron3-Photoroom.png',                 text: 'a cat, a nest, a jug, a lamp'             }        ];        const trainContainer = document.getElementById('train');        const taskBoard = document.getElementById('taskBoard');        const playBtn = document.getElementById('playBtn');        // Собираем поезд        trainCars.forEach(car => {            const img = document.createElement('img');            img.src = car.img;            img.alt = car.id;            img.dataset.text = car.text;                         img.addEventListener('click', (e) => {                e.stopPropagation();                 trainContainer.classList.add('paused');                taskBoard.innerHTML = `<span>👉</span> ${car.text}`;                playBtn.style.display = 'block';            });            trainContainer.appendChild(img);        });        playBtn.addEventListener('click', () => {            trainContainer.classList.remove('paused');            taskBoard.innerHTML = 'Нажми на проезжающий вагон...';            playBtn.style.display = 'none';        });    </script></body></html>
